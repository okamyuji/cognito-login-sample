{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/alpine.min.js" defer></script>
{{end}}

{{define "flash"}}
<div class="flash {{.Kind}}">{{.Message}}</div>
{{end}}

{{define "confirm_form"}}
{{if .Signup}}
<div class="flash info">登録を受け付けました。未登録のメールアドレスであれば、{{.Email}} 宛に確認コードが届きます。すでに登録済みの場合はコードが届かないため、ログインしてください。</div>
{{else}}
<div class="flash info">確認コードを {{.Email}} 宛に送信しました。メールに記載のコードを入力してください。</div>
{{end}}
<form hx-post="/api/confirm" hx-target="#result" class="stack">
  <input type="hidden" name="email" value="{{.Email}}">
  <label for="code">確認コード</label>
  <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required>
  <button type="submit">確認する</button>
</form>
<form hx-post="/api/resend" hx-target="#resend-result" class="stack">
  <input type="hidden" name="email" value="{{.Email}}">
  <button type="submit">確認コードを再送する</button>
</form>
<div id="resend-result"></div>
{{end}}
