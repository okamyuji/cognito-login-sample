{{define "login"}}
<!doctype html>
<html lang="ja">
<head>
  {{template "head" .}}
  <title>ログイン | cognito-login-sample</title>
</head>
<body>
  <main class="card">
    <h1>ログイン</h1>
    <form hx-post="/api/login" hx-target="#result" class="stack" x-data="{ show: false }">
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">パスワード</label>
      <div class="password-row">
        <input id="password" name="password" x-bind:type="show ? 'text' : 'password'" autocomplete="current-password" required>
        <button type="button" class="ghost" x-on:click="show = !show" x-text="show ? '隠す' : '表示'"></button>
      </div>
      <button type="submit">ログイン</button>
    </form>
    <div class="divider">または</div>
    <a class="social-button" href="/auth/google">
      <span class="social-mark" aria-hidden="true">G</span>
      Googleでログイン
    </a>
    <div id="result" aria-live="polite">{{if .Flash}}<div class="flash info">{{.Flash}}</div>{{end}}</div>
    <p class="note">アカウントをお持ちでない場合は<a href="/signup">新規登録</a>へ進んでください。</p>
  </main>
</body>
</html>
{{end}}
